# Segundo "despertador" para o Supabase gratuito não pausar por inatividade (7 dias).
# Independente do cron da Vercel (/api/manter-ativo): se um falhar, o outro cobre.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 3,15 * * *" # 00:17 e 12:17 (Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve no banco
        run: |
          curl -sf -o /dev/null -w "Supabase: %{http_code}\n" \
            "https://pvqikdeovfgbslfqjmxy.supabase.co/rest/v1/respostas_pre_consulta?select=id&limit=1" \
            -H "apikey: sb_publishable_4KZqDuVMsHQhzzZjsRuQUg_ese9wsRu"
      - name: Rotina da Vercel
        if: always()
        run: curl -s "https://formularioinstituto.vercel.app/api/manter-ativo"
