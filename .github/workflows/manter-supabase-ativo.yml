# Mantém os projetos Supabase gratuitos ativos (eles pausam após 7 dias sem atividade).
# Fala direto com cada Supabase, sem passar pela Vercel: os crons da Vercel podem ser
# bloqueados pela proteção de acesso das implantações.
# Para incluir outro projeto, copie um passo e troque endereço, chave pública e tabela.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "17 3,15 * * *" # 00:17 e 12:17 (Brasília)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Formulário Instituto Moromizato
        if: always()
        run: |
          curl -sf -o /dev/null -w "Formulario: %{http_code}\n" \
            "https://pvqikdeovfgbslfqjmxy.supabase.co/rest/v1/respostas_pre_consulta?select=id&limit=1" \
            -H "apikey: sb_publishable_4KZqDuVMsHQhzzZjsRuQUg_ese9wsRu"

      - name: Jefilms Client
        if: always()
        run: |
          curl -sf -o /dev/null -w "Jefilms Client: %{http_code}\n" \
            "https://uiaoeojmviqqwkgzfdhy.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_pc-uHI5LPCRLN3dvsg7NXQ_qBUUZMwN"
